name: E2E

# Ephemeral WordPress in CI: stand up a fresh WP via wp-env, build + install
# ThinkRank Free and Pro into it, then run the Playwright suite against it.
#
# Required repository secret:
#   PLUGIN_REPO_TOKEN — a GitHub token (PAT or fine-grained) with READ access to
#   WPDevelopers/thinkrank and WPDevelopers/thinkrank-pro (both private).
#
# wp-env serves the site at http://localhost:8888 with admin / password.
#
# Optional Slack report — set repo secrets SLACK_BOT_TOKEN (xoxb-… with
# chat:write) and SLACK_CHANNEL_ID. When SLACK_BOT_TOKEN is present the
# playwright-slack-report reporter posts a run summary to the channel.

on:
  workflow_dispatch:
    inputs:
      slack_channel:
        description: "Send Slack report? (on/off)"
        type: choice
        options: [on, 'off']
        default: 'on'

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      HUSKY: '0'
      WP_URL: http://localhost:8888
      WP_ADMIN_USER: admin
      WP_ADMIN_PASS: password
    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      # pnpm builds the plugins (pnpm-lock); npm runs the automation repo (package-lock).
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      # ── Fetch the plugin sources (private repos) ──────────────────────────
      - name: Check out ThinkRank Free
        uses: actions/checkout@v4
        with:
          repository: WPDevelopers/thinkrank
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: .wp-plugins/thinkrank

      - name: Check out ThinkRank Pro
        uses: actions/checkout@v4
        with:
          repository: WPDevelopers/thinkrank-pro
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: .wp-plugins/thinkrank-pro

      # ── Build the plugins (assets/, dist/, vendor/ are gitignored) ────────
      - name: Build ThinkRank Free
        working-directory: .wp-plugins/thinkrank
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          # Bundled MCP runtime — a separate Composer project whose vendor/ is
          # gitignored. thinkrank.php loads dependencies/vendor/autoload_packages.php
          # to register the /mcp/* routes; without it those tests 404. Mirrors build-dist.sh.
          if [ -f dependencies/composer.json ]; then
            ( cd dependencies && composer install --no-dev --optimize-autoloader --no-interaction )
          fi
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      - name: Build ThinkRank Pro
        working-directory: .wp-plugins/thinkrank-pro
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      # ── Automation deps + browser (npm) ───────────────────────────────────
      - name: Install automation dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # ── Stand up WordPress and activate the plugins ───────────────────────
      - name: Start WordPress (wp-env)
        run: npx wp-env start

      - name: Activate ThinkRank Free + Pro
        run: npx wp-env run cli wp plugin activate thinkrank thinkrank-pro

      # ── Run the suite ─────────────────────────────────────────────────────
      # Slack env only on this step, so a CI run posts a single summary
      # (the editor lane below runs without the Slack reporter).
      - name: Run E2E suite (fast lane)
        run: npm test
        env:
          SLACK_BOT_TOKEN: ${{ inputs.slack_channel != 'off' && secrets.SLACK_BOT_TOKEN || '' }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          PAGES_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Run editor lane
        run: npm run test:editor

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
