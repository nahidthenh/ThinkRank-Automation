name: E2E

# Ephemeral WordPress in CI: stand up a fresh WP via wp-env, build + install
# ThinkRank Free and Pro into it, then run the Playwright suite against it.
#
# Required repository secret:
#   PLUGIN_REPO_TOKEN — a GitHub token (PAT or fine-grained) with READ access to
#   WPDevelopers/thinkrank and WPDevelopers/thinkrank-pro (both private).
#
# wp-env serves the site at http://localhost:8888 with admin / password.
#
# Optional Slack report — set repo secrets SLACK_BOT_TOKEN (xoxb-… with
# chat:write) and SLACK_CHANNEL_ID. When SLACK_BOT_TOKEN is present the
# playwright-slack-report reporter posts a run summary to the channel.

on:
  workflow_dispatch:
    inputs:
      free_ref:
        description: "ThinkRank Free branch / tag / SHA to test (blank = default branch)"
        type: string
        default: ""
      pro_ref:
        description: "ThinkRank Pro branch / tag / SHA to test (blank = default branch)"
        type: string
        default: ""
      slack_channel:
        description: "Send Slack report? (on/off)"
        type: choice
        options: ['on', 'off']
        default: 'on'

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Needed to publish the Playwright HTML report to the gh-pages branch.
    permissions:
      contents: write
    env:
      HUSKY: '0'
      WP_URL: http://localhost:8888
      WP_ADMIN_USER: admin
      WP_ADMIN_PASS: password
    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      # pnpm builds the plugins (pnpm-lock); npm runs the automation repo (package-lock).
      # pnpm 10+ reads pnpm-workspace.yaml as a settings file (shamefullyHoist,
      # allowBuilds); pnpm 9 treats it as a workspace and fails with "packages
      # field missing or empty". The plugins are authored on pnpm 10/11.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      # ThinkRank Pro requires a private Composer dependency
      # (WPDevelopers/licensing via a git VCS repo). Give Composer a token so it
      # can clone it over HTTPS; the token needs READ access to that repo too.
      - name: Authenticate Composer for private WPDevelopers repos
        run: composer config --global github-oauth.github.com "${{ secrets.PLUGIN_REPO_TOKEN }}"

      # The plugin repos ship no composer.lock, so `composer install` resolves the
      # full tree — including require-dev — even with --no-dev (which only skips
      # *installing* dev packages, not resolving them). Composer 2.9+ then aborts
      # the resolve because a dev-only dependency (wp-coding-standards/wpcs ^2.3)
      # has a security advisory. wpcs is a linting tool, irrelevant to the E2E
      # build, so disable advisory-blocking for this ephemeral CI build.
      - name: Disable Composer security-advisory blocking (dev-only deps)
        run: composer config --global policy.advisories.block false

      # ── Fetch the plugin sources (private repos) ──────────────────────────
      # ref blank → the repo's default branch; set free_ref/pro_ref (e.g. "dev")
      # to test a specific pre-release branch/tag/SHA of each plugin.
      #
      # A fix branch usually lives in only ONE of the two repos (e.g. the free
      # repo has fix/security-276-284, Pro does not), yet the same value often
      # gets pasted into both inputs. actions/checkout then hard-fails on the
      # repo that lacks the ref. So resolve each ref first and fall back to that
      # repo's default branch when it doesn't exist, with a warning in the
      # summary. `gh api repos/<repo>/commits/<ref>` resolves branches, tags and
      # raw SHAs in one call, so all three input forms keep working.
      - name: Resolve plugin refs
        id: refs
        env:
          GH_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
          FREE_REF: ${{ inputs.free_ref }}
          PRO_REF: ${{ inputs.pro_ref }}
        run: |
          resolve() { # $1 = repo, $2 = requested ref, $3 = output key
            repo="$1"; ref="$2"; key="$3"
            if [ -n "$ref" ] && ! gh api "repos/${repo}/commits/${ref}" --silent 2>/dev/null; then
              echo "::warning::${repo} has no ref '${ref}' — falling back to its default branch."
              echo "- :warning: \`${repo}\` has no ref \`${ref}\` — used its **default branch** instead." \
                >> "$GITHUB_STEP_SUMMARY"
              ref=""
            fi
            echo "${key}=${ref}" >> "$GITHUB_OUTPUT"
          }
          resolve WPDevelopers/thinkrank     "$FREE_REF" free
          resolve WPDevelopers/thinkrank-pro "$PRO_REF"  pro

      - name: Check out ThinkRank Free
        uses: actions/checkout@v4
        with:
          repository: WPDevelopers/thinkrank
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          ref: ${{ steps.refs.outputs.free }}
          path: .wp-plugins/thinkrank

      - name: Check out ThinkRank Pro
        uses: actions/checkout@v4
        with:
          repository: WPDevelopers/thinkrank-pro
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          ref: ${{ steps.refs.outputs.pro }}
          path: .wp-plugins/thinkrank-pro

      - name: Show plugin versions under test
        run: |
          FREE_SHA=$(git -C .wp-plugins/thinkrank rev-parse --short HEAD)
          PRO_SHA=$(git -C .wp-plugins/thinkrank-pro rev-parse --short HEAD)
          echo "Free: ${{ steps.refs.outputs.free || '(default branch)' }} @ ${FREE_SHA}"
          echo "Pro:  ${{ steps.refs.outputs.pro || '(default branch)' }} @ ${PRO_SHA}"
          {
            echo "### Plugin build under test"
            echo "- **Free:** \`${{ steps.refs.outputs.free || 'default' }}\` @ \`${FREE_SHA}\`"
            echo "- **Pro:** \`${{ steps.refs.outputs.pro || 'default' }}\` @ \`${PRO_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Build the plugins (assets/, dist/, vendor/ are gitignored) ────────
      - name: Build ThinkRank Free
        working-directory: .wp-plugins/thinkrank
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          # Bundled MCP runtime — a separate Composer project whose vendor/ is
          # gitignored. thinkrank.php loads dependencies/vendor/autoload_packages.php
          # to register the /mcp/* routes; without it those tests 404. Mirrors build-dist.sh.
          if [ -f dependencies/composer.json ]; then
            ( cd dependencies && composer install --no-dev --optimize-autoloader --no-interaction )
          fi
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      - name: Build ThinkRank Pro
        working-directory: .wp-plugins/thinkrank-pro
        run: |
          # Pro's only Composer runtime dependency (wpdeveloper/licensing) is
          # Mozart-scoped and ALREADY COMMITTED under includes/Dependencies/,
          # mapped via the composer autoload (THINKRANK_PRO\Dependencies\). So we
          # only need to generate the autoloader — `composer install` would try to
          # re-clone the private WPDevelopers/licensing repo and fail. dump-autoload
          # runs fully offline and produces the same vendor/autoload.php the
          # distributed plugin ships.
          composer dump-autoload --no-dev --optimize --no-interaction
          # Pro is an npm project — its committed lockfile is package-lock.json
          # (pnpm-lock.yaml is gitignored). Use npm; fall back to a plain install
          # if the lockfile is missing or out of sync. HUSKY=0 skips the prepare hook.
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      # ── Automation deps + browser (npm) ───────────────────────────────────
      - name: Install automation dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # ── Stand up WordPress and activate the plugins ───────────────────────
      - name: Start WordPress (wp-env)
        run: npx wp-env start

      - name: Activate ThinkRank Free + Pro
        run: npx wp-env run cli wp plugin activate thinkrank thinkrank-pro

      # Pro gates its feature components behind License\Manager::is_valid()
      # (thinkrank-pro #93): unlicensed, only `license` and `admin` load, so
      # API\Manager never registers a single feature route and every
      # /thinkrank-pro/v1 call 404s — which silently wiped out all ~50 @pro
      # tests on this ephemeral site.
      #
      # is_valid() returns true on `status === 'valid'` alone, so writing the
      # option satisfies the gate offline: no call to the licensing server, no
      # OTP, no activation slot consumed.
      #
      # Deliberately NO key. CronChecker::check() bails on an empty key, so the
      # weekly check can never overwrite this status mid-run; seeding a fake key
      # instead would let the store write back "invalid" and break the suite
      # partway through.
      - name: Mark ThinkRank Pro as licensed (ephemeral CI site)
        run: npx wp-env run cli wp option update thinkrank_pro_software__license_status valid

      # Pretty permalinks — required for the rewrite-based public URLs the suite
      # checks (e.g. /sitemap_index.xml). Fresh wp-env defaults to plain (?p=).
      - name: Enable pretty permalinks
        run: |
          npx wp-env run cli wp rewrite structure '/%postname%/'
          npx wp-env run cli wp rewrite flush --hard

      # ── Run the suite ─────────────────────────────────────────────────────
      # Slack env only on this step, so a CI run posts a single summary
      # (the editor lane below runs without the Slack reporter).
      - name: Run E2E suite (fast lane)
        id: fast_lane
        run: npm test
        env:
          # A licensed Pro is a hard precondition in CI: without it the @pro
          # specs self-skip and the run would go green having tested nothing.
          REQUIRE_PRO: '1'
          SLACK_BOT_TOKEN: ${{ inputs.slack_channel != 'off' && secrets.SLACK_BOT_TOKEN || '' }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # The Slack "View Results!" link points at the PUBLIC hosted report
          # (GitHub Pages), not the Actions run page. Per-run subpath so each
          # message links to its own report permanently.
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/runs/${{ github.run_id }}/
          # Shown in the Slack summary so a release run says which branch it tested.
          TEST_BUILD_LABEL: "free: ${{ inputs.free_ref || 'default' }} · pro: ${{ inputs.pro_ref || 'default' }}"

      # Assemble the Pages site: this run's report under runs/<id>/ plus a root
      # index.html that redirects to it — so both the per-run URL (used by the
      # Slack link) AND the bare Pages root resolve to the latest report.
      #
      # These post-run steps are gated on the suite having actually run: when an
      # earlier step (plugin checkout, build, wp-env) fails there is no report to
      # publish, and an unconditional `always()` here buried the real failure
      # under "cp: cannot stat 'playwright-report/.'" and "playwright: not found".
      - name: Assemble Pages site
        if: always() && steps.fast_lane.conclusion != 'skipped'
        run: |
          mkdir -p public/runs/${{ github.run_id }}
          cp -r playwright-report/. public/runs/${{ github.run_id }}/
          cat > public/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>ThinkRank E2E — latest report</title>
          <meta http-equiv="refresh" content="0; url=./runs/${{ github.run_id }}/">
          <p>Redirecting to the <a href="./runs/${{ github.run_id }}/">latest Playwright report</a>…</p>
          HTML

      # Publish to GitHub Pages (gh-pages branch). keep_files retains prior runs;
      # the root index.html is overwritten each run to point at the newest report.
      - name: Publish report to GitHub Pages
        if: always() && hashFiles('public/index.html') != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

      - name: Run editor lane
        if: always() && steps.fast_lane.conclusion != 'skipped'
        run: npm run test:editor
        env:
          REQUIRE_PRO: '1'

      - name: Upload Playwright report
        if: always() && hashFiles('playwright-report/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
