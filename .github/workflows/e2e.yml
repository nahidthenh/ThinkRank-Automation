name: E2E

# Ephemeral WordPress in CI: stand up a fresh WP via wp-env, build + install
# ThinkRank Free and Pro into it, then run the Playwright suite against it.
#
# Required repository secret:
#   PLUGIN_REPO_TOKEN — a GitHub token (PAT or fine-grained) with READ access to
#   WPDevelopers/thinkrank and WPDevelopers/thinkrank-pro (both private).
#
# wp-env serves the site at http://localhost:8888 with admin / password.
#
# Optional Slack report — set repo secrets SLACK_BOT_TOKEN (xoxb-… with
# chat:write) and SLACK_CHANNEL_ID. When SLACK_BOT_TOKEN is present the
# playwright-slack-report reporter posts a run summary to the channel.

on:
  workflow_dispatch:
    inputs:
      slack_channel:
        description: "Send Slack report? (on/off)"
        type: choice
        options: ['on', 'off']
        default: 'on'

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Needed to publish the Playwright HTML report to the gh-pages branch.
    permissions:
      contents: write
    env:
      HUSKY: '0'
      WP_URL: http://localhost:8888
      WP_ADMIN_USER: admin
      WP_ADMIN_PASS: password
    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      # pnpm builds the plugins (pnpm-lock); npm runs the automation repo (package-lock).
      # pnpm 10+ reads pnpm-workspace.yaml as a settings file (shamefullyHoist,
      # allowBuilds); pnpm 9 treats it as a workspace and fails with "packages
      # field missing or empty". The plugins are authored on pnpm 10/11.
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      # ThinkRank Pro requires a private Composer dependency
      # (WPDevelopers/licensing via a git VCS repo). Give Composer a token so it
      # can clone it over HTTPS; the token needs READ access to that repo too.
      - name: Authenticate Composer for private WPDevelopers repos
        run: composer config --global github-oauth.github.com "${{ secrets.PLUGIN_REPO_TOKEN }}"

      # ── Fetch the plugin sources (private repos) ──────────────────────────
      - name: Check out ThinkRank Free
        uses: actions/checkout@v4
        with:
          repository: WPDevelopers/thinkrank
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: .wp-plugins/thinkrank

      - name: Check out ThinkRank Pro
        uses: actions/checkout@v4
        with:
          repository: WPDevelopers/thinkrank-pro
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: .wp-plugins/thinkrank-pro

      # ── Build the plugins (assets/, dist/, vendor/ are gitignored) ────────
      - name: Build ThinkRank Free
        working-directory: .wp-plugins/thinkrank
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction
          # Bundled MCP runtime — a separate Composer project whose vendor/ is
          # gitignored. thinkrank.php loads dependencies/vendor/autoload_packages.php
          # to register the /mcp/* routes; without it those tests 404. Mirrors build-dist.sh.
          if [ -f dependencies/composer.json ]; then
            ( cd dependencies && composer install --no-dev --optimize-autoloader --no-interaction )
          fi
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm run build

      - name: Build ThinkRank Pro
        working-directory: .wp-plugins/thinkrank-pro
        run: |
          # Pro's only Composer runtime dependency (wpdeveloper/licensing) is
          # Mozart-scoped and ALREADY COMMITTED under includes/Dependencies/,
          # mapped via the composer autoload (THINKRANK_PRO\Dependencies\). So we
          # only need to generate the autoloader — `composer install` would try to
          # re-clone the private WPDevelopers/licensing repo and fail. dump-autoload
          # runs fully offline and produces the same vendor/autoload.php the
          # distributed plugin ships.
          composer dump-autoload --no-dev --optimize --no-interaction
          # Pro is an npm project — its committed lockfile is package-lock.json
          # (pnpm-lock.yaml is gitignored). Use npm; fall back to a plain install
          # if the lockfile is missing or out of sync. HUSKY=0 skips the prepare hook.
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm run build

      # ── Automation deps + browser (npm) ───────────────────────────────────
      - name: Install automation dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # ── Stand up WordPress and activate the plugins ───────────────────────
      - name: Start WordPress (wp-env)
        run: npx wp-env start

      - name: Activate ThinkRank Free + Pro
        run: npx wp-env run cli wp plugin activate thinkrank thinkrank-pro

      # Pretty permalinks — required for the rewrite-based public URLs the suite
      # checks (e.g. /sitemap_index.xml). Fresh wp-env defaults to plain (?p=).
      - name: Enable pretty permalinks
        run: |
          npx wp-env run cli wp rewrite structure '/%postname%/'
          npx wp-env run cli wp rewrite flush --hard

      # ── Run the suite ─────────────────────────────────────────────────────
      # Slack env only on this step, so a CI run posts a single summary
      # (the editor lane below runs without the Slack reporter).
      - name: Run E2E suite (fast lane)
        run: npm test
        env:
          SLACK_BOT_TOKEN: ${{ inputs.slack_channel != 'off' && secrets.SLACK_BOT_TOKEN || '' }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          # The Slack "View Results!" link points at the PUBLIC hosted report
          # (GitHub Pages), not the Actions run page. Per-run subpath so each
          # message links to its own report permanently.
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/runs/${{ github.run_id }}/

      # Publish the fast-lane HTML report to GitHub Pages (gh-pages branch) so the
      # Slack link resolves to a public page. Done before the editor lane, which
      # would otherwise overwrite playwright-report/. keep_files retains prior runs.
      - name: Publish Playwright report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: runs/${{ github.run_id }}
          keep_files: true

      - name: Run editor lane
        if: always()
        run: npm run test:editor

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
